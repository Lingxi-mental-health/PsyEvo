[metadata]
name = psyevo-method
version = 0.1.0
description = Method-only implementation of PsyEvo
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24

[options.packages.find]
where = src

[options.extras_require]
torch =
    torch>=2.0
